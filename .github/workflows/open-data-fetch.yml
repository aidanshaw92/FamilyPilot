# One-off open-data probe and fetch. NOT scheduled, NOT dispatchable, NOT run on pull requests.
#
# It runs only when the throwaway branch `data/open-data-fetch` is pushed, on GitHub's own runners (free for this public repository),
# because the cloud coding session's network policy refuses the open-data hosts and that policy is not to be worked around. This job has
# no secrets, no database access and makes no Google request. See open-data/README.md.
name: Open data fetch (one-off)

on:
  push:
    branches: [data/open-data-fetch]
    paths:
      - .github/workflows/open-data-fetch.yml
      - open-data/**

permissions:
  contents: read

jobs:
  discover:
    # Header-only look at what Geofabrik and the OS downloads API actually publish for London. Nothing large is downloaded.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Geofabrik index and OS download listing, filtered to London
        run: |
          UA="FamilyPilot-open-data/1.0 (+https://github.com/aidanshaw92/FamilyPilot)"
          echo "### Geofabrik extracts whose id or name mentions London"
          curl -sS --max-time 60 -A "$UA" https://download.geofabrik.de/index-v1-nogeom.json -o index.json
          python3 - <<'PY'
          import json
          idx = json.load(open('index.json'))
          for f in idx['features']:
              p = f['properties']
              if 'london' in (p.get('id','') + p.get('name','')).lower() or p.get('id') in ('england','greater-london'):
                  print(p.get('id'), '|', p.get('name'), '| parent', p.get('parent'), '|', json.dumps(p.get('urls')))
          PY
          echo
          echo "### OS Open Greenspace: every download for areas TQ and TL (London is TQ, with a little in TL), and the formats offered"
          curl -sS --max-time 60 -A "$UA" https://api.os.uk/downloads/v1/products/OpenGreenspace/downloads -o os.json
          python3 - <<'PY'
          import json
          rows = json.load(open('os.json'))
          print('total entries', len(rows), 'formats', sorted({r['format'] for r in rows}))
          for r in rows:
              if r['area'] in ('TQ','TL','GB'):
                  print(r['area'], '|', r['format'], '|', r['fileName'], '|', r['size'], 'bytes | md5', r['md5'])
          PY
