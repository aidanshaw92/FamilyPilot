# One-off open-data publish step. NOT scheduled, NOT dispatchable, NOT run on pull requests.
#
# The previous version of this file (in this branch's history) fetched Geofabrik, OS Open Greenspace and Wikidata once, on GitHub's own
# runner, and kept the result as run 38528419810's artifact. The cloud coding session's network policy does not reach the artifact host,
# and that policy is not to be worked around, so this job does the one thing left: it takes that artifact, checks it against its own
# provenance file, and publishes the same files (gzipped, with their licence notice) to the throwaway branch `data/open-data-inputs`,
# which the session can read through GitHub. Nothing is fetched from the open-data hosts again. No secret beyond the run's own token.
name: Open data publish (one-off)

on:
  push:
    branches: [data/open-data-fetch]
    paths:
      - .github/workflows/open-data-fetch.yml
      - open-data/**

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to write the throwaway branch data/open-data-inputs only
      actions: read     # to read the earlier run's artifact
    steps:
      - name: The artifact from the earlier fetch run
        uses: actions/download-artifact@v4
        with:
          name: open-data-inputs
          path: in
          run-id: 38528419810
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check each file against its provenance record
        run: |
          ls -l in
          python3 - <<'PY'
          import hashlib, json
          prov = json.load(open('in/PROVENANCE.json'))
          for f in prov['files']:
              h = hashlib.sha256(open('in/' + f['file'], 'rb').read()).hexdigest()
              assert h == f['sha256'], (f['file'], h, f['sha256'])
              print('ok', f['file'], f['bytes'], 'bytes', f['licence'])
          PY

      - name: Publish to the throwaway branch data/open-data-inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir pub && cp in/PROVENANCE.json in/NOTICE.txt pub/
          for f in london-family.geojson greenspace-london.geojson; do gzip -9 -c "in/$f" > "pub/$f.gz"; done
          cp in/wikidata-london.json pub/
          cat > pub/README.md <<'MD'
          Throwaway branch. Open data fetched once from its publishers by the repository's own GitHub Actions runner, for FamilyPilot's
          catalogue-recovery dry run. Never merged. See NOTICE.txt for the licences and credits and PROVENANCE.json for the source,
          retrieval time, size and SHA-256 of each file (the .gz files decompress to the files named there).
          MD
          cd pub
          git init -q -b data/open-data-inputs
          git config user.name "open-data-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Open data for the catalogue-recovery dry run (OSM, OS Open Greenspace, Wikidata), with licences and provenance"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin data/open-data-inputs
          ls -l
