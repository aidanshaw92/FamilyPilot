# One-off open-data diagnostic. NOT scheduled, NOT dispatchable, NOT run on pull requests.
#
# Runs only when the throwaway branch `data/open-data-fetch` is pushed, on GitHub's own runner (free for this public repository), because
# the cloud coding session's network policy refuses the open-data hosts and that policy is not to be worked around. No database, no Google.
#
# Passes 1 and 2 (this branch's history) fetched OpenStreetMap by a fixed list of tags. Reconciling that with the places we already hold
# showed gaps (city farms, soft play, some large parks) that the tag list does not reach. This pass asks the question the other way
# round: which NAMED features in Greater London look like a farm, a play centre or a large green space, whatever their tags? It
# downloads Greater London once and keeps the matches (name only, any tag) as a gzipped GeoJSON on the throwaway branch
# `data/open-data-inputs-diagnostic`, with the licence notice and provenance.
name: Open data diagnostic (one-off)

on:
  push:
    branches: [data/open-data-fetch]
    paths:
      - .github/workflows/open-data-fetch.yml
      - open-data/**

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only to write the throwaway branch data/open-data-inputs-diagnostic
    env:
      UA: FamilyPilot-open-data/1.0 (+https://github.com/aidanshaw92/FamilyPilot)
    steps:
      - name: Tools (from the Ubuntu archive)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool jq >/dev/null

      - name: Greater London, one download, then the named features that look relevant
        run: |
          mkdir -p work out
          URL="https://download.geofabrik.de/europe/united-kingdom/england/greater-london-latest.osm.pbf"
          curl -fSL --retry 2 -A "$UA" -o work/greater-london-latest.osm.pbf "$URL"
          curl -fSL --retry 2 -A "$UA" -o work/greater-london-latest.osm.pbf.md5 "$URL.md5"
          (cd work && md5sum -c greater-london-latest.osm.pbf.md5)
          osmium tags-filter work/greater-london-latest.osm.pbf nwr/name -o work/named.osm.pbf --overwrite
          osmium export work/named.osm.pbf -f geojsonseq --geometry-types=point,polygon --add-unique-id=type_id -a version -o work/named.geojsonseq --overwrite
          ls -l work/named.geojsonseq
          # Strip the RS (0x1e) record separators, then keep a feature when its name looks like a farm, a play centre, a green space or a landmark.
          tr -d '\036' < work/named.geojsonseq | jq -c 'select(.properties.name != null and (.properties.name | test("farm|zoo|aquarium|soft ?play|play ?(centre|center|zone|barn|land|space|house)|trampoline|jump|bounce|adventure|kids|children|nursery|wetland|garden|heath|common|forest|wood|castle|palace|manor|house|cable|studio|park|green|fields|recreation|museum|gallery|exhibition|observatory|wheel|eye|bridge|tunnel|dock"; "i")))' > work/subset.geojsonseq
          wc -l work/subset.geojsonseq
          jq -s '{type: "FeatureCollection", features: .}' work/subset.geojsonseq > out/osm-named-london.geojson
          ls -l out
          echo "key tag counts in the subset (what these things are tagged as):"
          jq -r '.features[].properties | (to_entries | map(select(.key | test("^(leisure|tourism|landuse|amenity|natural|boundary|attraction|zoo|historic|building|shop|sport)$")) | "\(.key)=\(.value)") | .[0:3] | join(" "))' out/osm-named-london.geojson | sort | uniq -c | sort -rn | head -40

      - name: Provenance and publish to the throwaway branch data/open-data-inputs-diagnostic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, datetime
          data = open('out/osm-named-london.geojson', 'rb').read()
          prov = {'generated_by': 'FamilyPilot open-data-fetch workflow, diagnostic pass (one-off)', 'user_agent': os.environ['UA'],
                  'files': [{'file': 'osm-named-london.geojson', 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                             'retrieved_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
                             'source': 'OpenStreetMap, Greater London (Geofabrik), named features whose name looks like a farm, play centre, green space or landmark; any tags',
                             'source_url': 'https://download.geofabrik.de/europe/united-kingdom/england/greater-london-latest.osm.pbf',
                             'licence': 'ODbL-1.0', 'licence_url': 'https://opendatacommons.org/licenses/odbl/1-0/',
                             'attribution': '© OpenStreetMap contributors', 'attribution_url': 'https://www.openstreetmap.org/copyright'}]}
          json.dump(prov, open('out/PROVENANCE.json', 'w'), indent=2)
          PY
          printf '%s\n' "OpenStreetMap data: © OpenStreetMap contributors, Open Database Licence 1.0 (https://www.openstreetmap.org/copyright)." "A diagnostic subset for FamilyPilot's catalogue-recovery dry run. Not for production use. See PROVENANCE.json." > out/NOTICE.txt
          mkdir pub && gzip -9 -c out/osm-named-london.geojson > pub/osm-named-london.geojson.gz && cp out/PROVENANCE.json out/NOTICE.txt pub/
          echo "Throwaway branch. OpenStreetMap data; never merged. See NOTICE.txt and PROVENANCE.json." > pub/README.md
          cd pub
          git init -q -b data/open-data-inputs-diagnostic
          git config user.name "open-data-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "OpenStreetMap, Greater London, named features that look relevant, with licence and provenance"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin data/open-data-inputs-diagnostic
          ls -l
