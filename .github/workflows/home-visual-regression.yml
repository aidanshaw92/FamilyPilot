name: Home visual regression

# Measures the rendered Home screen against the locked Figma frame "01 — Home".
#
# It builds the branch under test, serves it locally and drives it with a browser, so the run
# reviews the change rather than whatever is currently deployed. The 88 assertions are tied to the
# frame's own node ids (8:4, 40:2, 7:31, 9:2), so a drift from the approved design fails a build
# instead of surviving to a design review. It also runs the deck's gesture harness end to end: the
# swipe, the clamp at either end of the deck, and tap-versus-swipe disambiguation on a photograph.
#
# WHERE ITS DATA COMES FROM, AND WHY THAT CHANGED
#
# This workflow used to point the build at PRODUCTION and ran on every pull request touching
# `familypilot/**`. It ran 49 times in September 2026, and each run loaded Home in eight fresh
# browser contexts. Every one of those cost nine billable Google Nearby Search requests -- the
# nine-point London grid in `api/places/search.js` -- plus a Place Details and a Place Photos call
# for each photograph, through a proxy that set `Cache-Control: no-store`. Roughly 150 billable
# Google requests per run, for a check that measures geometry.
#
# So the default is now a local fixture (`familypilot/scripts/serve-places-fixture.mjs`): fifteen
# synthetic venues and generated images, no network, no spend, and deterministic -- the old job could
# fail because production's data had changed rather than because the design had. The live path is
# kept, because "does the real API still serve photographs" is a genuine question, but it is now an
# explicit `workflow_dispatch` choice rather than something every pull request pays for.

on:
  pull_request:
    paths:
      - 'familypilot/**'
      - '.github/workflows/home-visual-regression.yml'
  workflow_dispatch:
    inputs:
      data_source:
        description: Where Home's venue data comes from. "production" makes billable Google requests.
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - production
      api_base:
        description: Base URL of the deployed places API (only used when data_source is production)
        required: false
        default: https://family-pilot-seven.vercel.app/api/places

permissions:
  contents: read

env:
  # A pull_request event carries no inputs, so a pull request always gets the fixture. Spending has
  # to be asked for by name.
  DATA_SOURCE: ${{ inputs.data_source || 'fixture' }}
  FIXTURE_API_BASE: http://localhost:4174/api/places

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            familypilot/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        working-directory: familypilot
        run: npm ci

      - name: Install Chromium
        working-directory: familypilot
        run: npx playwright install --with-deps chromium

      # Resolves to the fixture unless a dispatch explicitly asked for production. Doing it in one
      # place means no later step can reach production by forgetting a condition.
      - name: Choose the places API
        id: api
        run: |
          if [ "$DATA_SOURCE" = "production" ]; then
            base="${{ inputs.api_base }}"
            echo "::warning::Running against production. This makes billable Google Places requests."
          else
            base="$FIXTURE_API_BASE"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "using $base"

      - name: Serve the places fixture
        if: env.DATA_SOURCE != 'production'
        working-directory: familypilot
        run: |
          node scripts/serve-places-fixture.mjs 4174 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null "http://localhost:4174/api/places/search?lat=51.5074&lng=-0.1278&radiusKm=40&scope=london&intent=explore" && break
            sleep 1
          done
          curl -sf -o /dev/null "http://localhost:4174/api/places/search?lat=51.5074&lng=-0.1278&radiusKm=40&scope=london&intent=explore" \
            || { echo "::error::places fixture never came up"; exit 1; }

      # Only on the production path, and only once. Fails early and legibly if the deployed API is
      # unreachable or serving mock data, because without real rows carrying photo references there
      # is nothing to photograph.
      - name: Check the deployed places API
        if: env.DATA_SOURCE == 'production'
        run: |
          set -o pipefail
          url="${{ steps.api.outputs.base }}/search?lat=51.5074&lng=-0.1278&radiusKm=40&scope=london&intent=explore"
          echo "GET $url"
          code=$(curl -sS -o /tmp/search.json -w '%{http_code}' --max-time 60 "$url") || true
          echo "status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::places API returned $code"
            head -c 400 /tmp/search.json || true
            exit 1
          fi
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/search.json", "utf8"));
            const withPhotos = (d.places || []).filter((p) => (p.photos || []).length > 0);
            console.log("provider:", d.provider, "places:", (d.places || []).length, "with photos:", withPhotos.length);
            console.log("cacheState:", d.cacheState, "placesEnabled:", d.placesEnabled);
            if (d.provider === "mock") { console.log("::error::API is serving mock data"); process.exit(1); }
            if (withPhotos.length === 0) { console.log("::error::no place carries a photo reference"); process.exit(1); }
          '

      - name: Build this branch against the chosen API
        working-directory: familypilot
        env:
          # The client reads this for /api/places/* and derives the photo origin from it.
          EXPO_PUBLIC_PLACES_API_URL: ${{ steps.api.outputs.base }}
        run: npx expo export --platform web

      - name: Serve the bundle
        working-directory: familypilot
        run: |
          npx serve dist -l 4173 --no-clipboard &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:4173/ || { echo "::error::static server never came up"; exit 1; }

      - name: Capture and measure against the locked frame
        working-directory: familypilot
        run: node scripts/verify-home-against-figma.mjs http://localhost:4173 ../docs/home-visual-regression

      - name: Element-by-element diff against the frame
        working-directory: familypilot
        run: node scripts/compare-home-to-figma.mjs http://localhost:4173

      - name: Deck gesture checks
        working-directory: familypilot
        run: node scripts/verify-deck-gesture.mjs http://localhost:4173

      - name: Report what actually loaded
        working-directory: familypilot
        run: node scripts/report-photo-evidence.mjs http://localhost:4173

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-visual-regression
          path: docs/home-visual-regression/
          if-no-files-found: error
