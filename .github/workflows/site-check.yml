# One-off: fetch each listed venue's own front page once and check that it names the venue. NOT scheduled, NOT dispatchable, NOT run on pull requests.
# Runs only when the throwaway branch `data/open-data-fetch` is pushed with a change under site-check/. GET only, robots.txt honoured, an identifying
# User-Agent, two seconds between requests, no secret, no database, no Google. The session's network refuses these hosts; the runner is an existing, authorised environment.
name: Venue site check (one-off)

on:
  push:
    branches: [data/open-data-fetch]
    paths:
      - .github/workflows/site-check.yml
      - site-check/**

permissions:
  contents: write   # only to commit the results file to this throwaway branch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests beautifulsoup4 lxml
      - run: python site-check/check.py site-check/input.json results/site-check/open-wd.json
      - name: Keep the results on the throwaway branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/site-check
          git commit -m "Venue site check results" || echo "nothing to commit"
          git pull --rebase origin data/open-data-fetch
          git push origin HEAD:data/open-data-fetch
