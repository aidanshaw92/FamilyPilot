# One-off, pass 17. NOT scheduled, NOT dispatchable, NOT run on pull requests. Runs only when the throwaway branch `data/open-data-fetch` is pushed with a change
# under legal-fetch16/. GET only, descriptive User-Agent, no secret, no database, no Google API. Records how the OSM Foundation's Licensing Working Group page says to contact it
# so the licensing question goes to the address the Foundation publishes.
name: OSMF contact route (one-off)

on:
  push:
    branches: [data/open-data-fetch]
    paths:
      - .github/workflows/legal-fetch16.yml
      - legal-fetch16/**

permissions:
  contents: write   # only to commit the result file to this throwaway branch

jobs:
  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests
      - run: python3 legal-fetch16/osmf_contact.py
      - name: Commit the result to the throwaway branch
        run: |
          git config user.name "open-data-fetch"; git config user.email "actions@users.noreply.github.com"
          git add results/softplay
          git commit -q -m "OSMF contact route: results, pass 17" || echo "nothing to commit"
          git push -q origin HEAD:data/open-data-fetch || true
