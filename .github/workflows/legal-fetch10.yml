# One-off, pass 11. NOT scheduled, NOT dispatchable, NOT run on pull requests. Runs only when the throwaway branch `data/open-data-fetch` is pushed with a change
# under legal-fetch10/. GET only, descriptive User-Agent, no secret, no database, no Google API. Records the Food Standards Agency's published licence and
# attribution wording for the Food Hygiene Rating Scheme open data, so the credit the app shows can quote it.
name: FSA open data terms (one-off)

on:
  push:
    branches: [data/open-data-fetch]
    paths:
      - .github/workflows/legal-fetch10.yml
      - legal-fetch10/**

permissions:
  contents: write   # only to commit the result file to this throwaway branch

jobs:
  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests
      - run: python3 legal-fetch10/fsa_terms.py
      - name: Commit the result to the throwaway branch
        run: |
          git config user.name "open-data-fetch"; git config user.email "actions@users.noreply.github.com"
          git add results/softplay
          git commit -q -m "FSA open data terms: results, pass 11" || echo "nothing to commit"
          git push -q origin HEAD:data/open-data-fetch || true
