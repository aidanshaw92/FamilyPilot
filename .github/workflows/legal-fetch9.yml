# One-off, pass 10. NOT scheduled, NOT dispatchable, NOT run on pull requests. Runs only when the throwaway branch `data/open-data-fetch` is pushed with a change
# under legal-fetch9/. GET only, descriptive User-Agent, no secret, no database, no Google API. Probes the Food Standards Agency's Food Hygiene Rating Scheme
# (open data, Open Government Licence v3.0) for establishments inside the app's London scope whose NAME says a play venue, to size how many soft-play venues
# an open source can name and place. It records names, business types, addresses and positions exactly as the FSA publishes them; it classifies nothing.
name: Soft-play source probe, FHRS (one-off)

on:
  push:
    branches: [data/open-data-fetch]
    paths:
      - .github/workflows/legal-fetch9.yml
      - legal-fetch9/**

permissions:
  contents: write   # only to commit the result file to this throwaway branch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests
      - run: python3 legal-fetch9/fhrs.py
      - name: Commit the result to the throwaway branch
        run: |
          git config user.name "open-data-fetch"; git config user.email "actions@users.noreply.github.com"
          git add results/softplay
          git commit -q -m "FHRS soft-play probe: results (OGL v3.0), pass 10" || echo "nothing to commit"
          git push -q origin HEAD:data/open-data-fetch || true
