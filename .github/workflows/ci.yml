name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            familypilot/package-lock.json

      # server/ (used by familypilot's tests and API routes, e.g.
      # server/enrichment/_lib/supabase-admin.js) lives outside familypilot/
      # and depends on the root package.json (@supabase/supabase-js,
      # @vercel/node). Node's module resolution walks up to the root
      # node_modules, so it must be installed too - mirrors vercel.json's
      # own installCommand.
      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        working-directory: familypilot
        run: npm ci

      - name: Typecheck
        working-directory: familypilot
        run: npm run typecheck

      - name: Build (web)
        # Runs before the test suite: a handful of tests assert that
        # `dist/` contains the expected static routes after a build.
        working-directory: familypilot
        run: npm run build:web

      - name: Test
        working-directory: familypilot
        run: npm test -- --run

  privilege-model:
    # The privilege work is the one part of this repo whose correctness lives in PostgreSQL rather
    # than in TypeScript, and vitest has no database -- it can only read the migration's text. So
    # this job runs the real thing: it rebuilds production's pre-migration privilege state in a
    # throwaway PostgreSQL 17 (production's major version, where MAINTAIN exists), applies the
    # migration, and asserts the resulting ACLs, including what a newly created table, sequence and
    # function inherit. Without it, "CI is green" would say nothing at all about who can TRUNCATE a
    # table.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the server major version matches production
        run: |
          version=$(psql -Atc "show server_version_num")
          echo "server_version_num=$version"
          test "$version" -ge 170000 || { echo "expected PostgreSQL 17+, got $version"; exit 1; }

      - name: Rebuild production's pre-migration privilege state
        run: psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/fixture_production_acl_baseline.sql

      - name: Assert the fixture really does reproduce the broad legacy ACL
        # Guards against the fixture silently degrading into an empty database, which would make
        # the migration trivially "pass" without ever subtracting anything.
        run: psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/assert_fixture_baseline.sql

      - name: Apply the migration
        run: psql -v ON_ERROR_STOP=1 -f familypilot/supabase/migrations/20260920210000_least_privilege_client_roles.sql

      - name: Assert the resulting privilege model
        run: psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/least_privilege_acl_check.sql

      - name: Apply the migration a second time and re-assert
        # Deploy safety: re-running a migration must not change the outcome.
        run: |
          psql -v ON_ERROR_STOP=1 -f familypilot/supabase/migrations/20260920210000_least_privilege_client_roles.sql
          psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/least_privilege_acl_check.sql

      - name: Apply the venue age-policy migration
        # Applied AFTER the privilege migration on purpose: that is the production order, and the
        # two interact. A CHECK constraint calls its validator as the WRITING role and that call
        # is privilege-checked, so the write probe below would fail with "permission denied for
        # function" if the privilege model ever stopped leaving service_role able to execute a
        # new function in public.
        run: psql -v ON_ERROR_STOP=1 -f familypilot/supabase/migrations/20260921120000_venue_age_policy.sql

      - name: Assert the age-policy read model's shape guard
        run: psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/venue_age_policy_shape_check.sql

      - name: Prove the guard holds for the role that actually writes
        # The shape check calls the validator directly. This writes through the real constraint as
        # service_role, so a missing EXECUTE grant or a detached constraint fails here rather than
        # in production.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          alter table public.venue_family_metadata add column if not exists ci_probe_id text;
          grant insert, delete on public.venue_family_metadata to service_role;
          set role service_role;
          insert into public.venue_family_metadata (venue_age_policy)
            values ('{"restrictions":[],"caveats":[],"sourcesDisagree":true}');
          do $$
          begin
            begin
              insert into public.venue_family_metadata (venue_age_policy)
                values ('{"restrictions":[{"minMonthsInclusive":48,"maxMonthsExclusive":null,"checkedAt":null}],"caveats":[],"sourcesDisagree":false}');
              raise exception 'a door with no source was accepted';
            exception when check_violation then
              raise notice 'the constraint rejected a source-less door, as it must';
            end;
          end;
          $$;
          reset role;
          delete from public.venue_family_metadata;
          SQL

      - name: Apply the age-policy migration a second time and re-assert
        run: |
          psql -v ON_ERROR_STOP=1 -f familypilot/supabase/migrations/20260921120000_venue_age_policy.sql
          psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/venue_age_policy_shape_check.sql

      - name: Prove the validators are caller-dependent BEFORE the search_path pin
        # The counterfactual, run against the real functions while they are still unpinned. Without
        # this step the next one could pass on a database where the pin was never needed, and the
        # migration would be verified against nothing.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            -- Valid bounds: a real minimum and an explicit null maximum. The validator must return
            -- TRUE for this on a clean path, which is what makes the shadowed result meaningful --
            -- a payload that is false either way would prove nothing.
            valid jsonb := '{"minMonthsInclusive": 48, "maxMonthsExclusive": null}'::jsonb;
            clean_verdict boolean;
            shadowed_verdict boolean;
          begin
            set local search_path = pg_catalog, public;
            clean_verdict := public.venue_age_bounds_are_valid(valid);
            if not clean_verdict then
              raise exception 'the validator rejects valid bounds on a clean path; the probe payload is wrong';
            end if;

            create schema ci_unpinned_probe;
            create function ci_unpinned_probe.jsonb_typeof(jsonb)
              returns text language sql immutable as 'select ''array''';
            set local search_path = ci_unpinned_probe, public, pg_catalog;
            shadowed_verdict := public.venue_age_bounds_are_valid(valid);

            if shadowed_verdict = clean_verdict then
              raise exception 'the unpinned validator ignored a shadowed jsonb_typeof, so the pin cannot be shown to matter';
            end if;
            raise notice 'unpinned validator is caller-dependent (clean %, shadowed %), as expected before the pin',
              clean_verdict, shadowed_verdict;

            reset search_path;
            drop schema ci_unpinned_probe cascade;
          end;
          $$;
          SQL

      - name: Pin the age-policy validators' search_path
        run: psql -v ON_ERROR_STOP=1 -f familypilot/supabase/migrations/20260926090000_age_policy_function_search_path.sql

      - name: Assert the pin holds and the validators still resolve every name they use
        run: |
          psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/age_policy_search_path_check.sql
          psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/venue_age_policy_shape_check.sql

      - name: Apply the search_path migration a second time and re-assert
        # Deploy safety: ALTER FUNCTION ... SET is idempotent, and this is what proves it.
        run: |
          psql -v ON_ERROR_STOP=1 -f familypilot/supabase/migrations/20260926090000_age_policy_function_search_path.sql
          psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/age_policy_search_path_check.sql
          psql -v ON_ERROR_STOP=1 -f familypilot/supabase/checks/venue_age_policy_shape_check.sql
