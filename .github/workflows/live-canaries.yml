name: Live canaries against a Preview build

# The two canaries that have to run against a DEPLOYED build rather than from a runner, kept in one
# workflow because they share the preview-discovery step and are dispatched together or not at all.
#
#   nearby-food  Section 16's restaurant canary. ZERO Google cost by construction. Moved off the runner
#               because Overpass rate-limits shared cloud address space, so figures gathered from a
#               GitHub IP described the runner's standing with Overpass rather than the product's.
#               Running it through the deployment uses Vercel's egress, the real User-Agent and the real
#               cache -- a better measurement and a politer one, since it is the request the product
#               makes anyway.
#
#   routes      ONE Google Routes element, which is the smallest matrix that can exist. Off by default.
#               It reports a closed gate as a failure rather than passing, because the journey endpoint
#               returns usable estimated minutes when the gate refuses, so a closed gate otherwise looks
#               exactly like success.
#
# Neither canary retries. A failure is a measurement.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment to test. Defaults to production.
        required: false
        default: 'https://family-pilot-seven.vercel.app'
      run_nearby_food:
        description: Run the Section 16 restaurant canary (free, zero Google)
        type: boolean
        required: false
        default: true
      run_routes:
        description: Run the Google Routes canary (spends 1 billable element)
        type: boolean
        required: false
        default: false
      assert_fail_closed:
        description: Assert the target's Google cost posture (free, no provider request)
        type: boolean
        required: false
        default: false
      posture_profile:
        description: closed = every scope must refuse (Preview). production = journeys and probe must refuse.
        type: choice
        required: false
        default: closed
        options:
          - closed
          - production
      expect_off:
        description: Comma-separated scopes that must refuse in addition to the profile, e.g. photos (free, no provider request)
        type: string
        required: false
        default: ''
      verify_cache_headers:
        description: Verify the food cache fixes against the deployment (costs ONE Overpass query)
        type: boolean
        required: false
        default: false
      verify_client_config:
        description: Verify the shipped web bundle is configured for Saved backup and ships no server secret (free, GET only)
        type: boolean
        required: false
        default: false

# The target is an input now, so no deployments/statuses read is needed.
permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vercel publishes a STABLE alias per target, so the URL is known without asking anything.
      #
      # This replaced a step that polled GitHub's Deployments API for a successful vercel.app status.
      # That is the mechanism the Places live smoke test uses and it works for pull-request previews,
      # but a PRODUCTION push registers no such Deployment: the first real run of this workflow sat in
      # that loop for ten minutes waiting for a record that was never going to appear. An input with a
      # sensible default is simpler and does not depend on a Vercel-to-GitHub integration detail that
      # varies by target.
      - name: Resolve the target and prove it is reachable
        id: target
        env:
          BASE: ${{ inputs.base_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          url="${BASE:-https://family-pilot-seven.vercel.app}"
          url="${url%/}"
          echo "target: $url"
          case "$url" in
            https://*) ;;
            *) echo "::error::base_url must be an https URL"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

          auth=()
          if [ -n "${BYPASS:-}" ]; then
            auth+=(-H "x-vercel-protection-bypass: ${BYPASS}" -H "x-vercel-set-bypass-cookie: true")
          fi

          # Reachability first, so an unreachable target is never reported as a product failure.
          # /api/places/status is free and makes no provider request.
          code=$(curl -sS "${auth[@]}" -o /tmp/target-status.json -w '%{http_code}' --max-time 45 \
            -L --max-redirs 5 -c /tmp/cookies -b /tmp/cookies \
            "$url/api/places/status" || echo 000)
          echo "status endpoint: $code"
          if [ "$code" != "200" ]; then
            echo "::error::$url/api/places/status returned $code, so this run cannot reach the build under test. For a Preview target the VERCEL_AUTOMATION_BYPASS_SECRET repository secret is required."
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            try {
              const b = JSON.parse(fs.readFileSync("/tmp/target-status.json","utf8"));
              console.log("journeys scope:", JSON.stringify(b.placesBudget?.scopes?.journeys ?? "(absent)"));
              console.log("usage today:", JSON.stringify(b.placesBudget?.today ?? {}));
            } catch { console.log("status body unreadable; continuing"); }
          '

      # Reads the posture the reachability step already fetched, so it adds no request at all.
      #
      # This is the other half of the Routes canary: the owner asked for the temporary Preview
      # spend-enabling variables to be restored and then for Preview to be VERIFIED fail-closed again.
      # Editing the variables is a change to the dashboard; a Vercel build bakes environment values, so
      # only a deployment's own /api/places/status can show the posture the running code actually has.
      # TWO PROFILES, BECAUSE THE TWO ENVIRONMENTS HAVE DIFFERENT CORRECT ANSWERS. In Preview every scope
      # must refuse. In production Google Places discovery IS the product and `masterEnabled()` defaults
      # true, so demanding that everything refuse would report the product as a defect -- which the first
      # run of this against production did, for six scopes behaving as designed. The production profile is
      # not a relaxation: it still demands that `journeys` and `probe` refuse, and still fails on an empty
      # scope map. Being wrong about the expectation was not a reason to stop looking: that same run found
      # `probeEnabled: true`, a public unauthenticated path to billable Nearby Search.
      - name: Assert the target is fail-closed for every paid Google scope
        if: ${{ inputs.assert_fail_closed }}
        env:
          PROFILE: ${{ inputs.posture_profile }}
          EXPECT_OFF: ${{ inputs.expect_off }}
        run: |
          set -euo pipefail
          cd familypilot
          extra=()
          if [ -n "${EXPECT_OFF:-}" ]; then
            case "$EXPECT_OFF" in
              *[!a-z,]*) echo "::error::expect_off may only name scopes, e.g. photos,refresh"; exit 1 ;;
            esac
            extra+=("--expect-off=${EXPECT_OFF}")
          fi
          if [ "${PROFILE:-closed}" = "production" ]; then
            node scripts/assert-places-fail-closed.mjs /tmp/target-status.json --profile=production "${extra[@]}"
          else
            node scripts/assert-places-fail-closed.mjs /tmp/target-status.json "${extra[@]}"
          fi

      # Runs first and costs nothing. A canary that spends before confirming its own preconditions is
      # how a bill arrives unexplained.
      - name: Pre-flight the Routes canary's six confirmations
        if: ${{ inputs.run_routes }}
        run: |
          set -euo pipefail
          cd familypilot
          node scripts/preflight-routes-canary.mjs

      - name: Section 16 restaurant canary
        if: ${{ inputs.run_nearby_food }}
        env:
          PREVIEW: ${{ steps.target.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          cd familypilot
          node scripts/canary-nearby-food-live.mjs "$PREVIEW" "${BYPASS:-}"

      # curl, not node fetch. Vercel hands the protection-bypass cookie over on a redirect, and `fetch`
      # follows redirects without persisting cookies, so the first attempt died with a bare
      # `fetch failed` having proved nothing. The TfL smoke test already showed curl with -L and a
      # cookie jar works for a POST through the bypass.
      - name: Ask for ONE routed element
        if: ${{ inputs.run_routes }}
        env:
          PREVIEW: ${{ steps.target.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          endpoint="${PREVIEW}/api/context/journey"
          # Trafalgar Square -> Tower of London. One origin, one destination: 1 billable element.
          body='{"origin":{"latitude":51.508,"longitude":-0.1281},"destinations":[{"placeId":"routes-canary-tower-of-london","latitude":51.5081,"longitude":-0.0759}]}'
          echo "POST ${endpoint}"
          echo "body: ${body}"

          auth=()
          if [ -n "${BYPASS:-}" ]; then
            auth+=(-H "x-vercel-protection-bypass: ${BYPASS}" -H "x-vercel-set-bypass-cookie: true")
          fi

          code=$(curl -sS "${auth[@]}" \
            -X POST -H 'Content-Type: application/json' -d "$body" \
            -L --max-redirs 5 -c /tmp/cookies -b /tmp/cookies \
            -D /tmp/routes-headers -o /tmp/routes-response.json \
            -w '%{http_code}' --max-time 90 "$endpoint")
          echo "status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::journey endpoint returned $code"
            head -c 400 /tmp/routes-response.json || true
            exit 1
          fi

      - name: Assert exactly one real routed element, and report predicted against actual
        if: ${{ inputs.run_routes }}
        run: |
          set -euo pipefail
          cd familypilot
          node scripts/canary-routes-live.mjs /tmp/routes-response.json /tmp/target-status.json

      # ONE Overpass query, zero Google. Proves the deployed build -- not the unit tests -- stops the edge
      # replaying a cache miss, and still lets it replay a hit.
      #
      # The cache key rounds the radius to whole kilometres, so asking a known anchor at an unused radius
      # is a genuinely cold key without inventing a place. Gladstone Park is the SPARSEST of the five
      # Section 16 anchors (8 candidates, 9.4s) so this is the cheapest cold lookup available, and the
      # second request must be served from the store rather than from Overpass.
      - name: Verify the food cache fixes against the deployment
        if: ${{ inputs.verify_cache_headers }}
        env:
          TARGET: ${{ steps.target.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          # A COLD KEY, AND A DIFFERENT ONE EVERY RUN.
          #
          # The first version pinned radiusM=2000 because no Section 16 run had used it. That worked once:
          # the next run found the key warm, so its first request was a HIT and the miss path could not be
          # measured at all -- the check failed rather than passing vacuously, which is right, but it also
          # meant the check only worked once per six hours. Radius is a poor lever for this because the key
          # rounds it to whole kilometres and the provider clamps at 2500m, so it yields about four keys.
          #
          # Latitude is the right lever: the key rounds coordinates to four decimals, about 11 metres, so
          # stepping the run number gives a fresh key every run. Against a 2km radius an 11m shift is
          # immaterial -- it is the same streets, inside the same park -- and 50 steps spans about 550m, so
          # it never leaves Gladstone Park, which is the sparsest of the five anchors and therefore the
          # cheapest cold lookup available. Total cost stays ONE Overpass query per run.
          offset=$(( ${GITHUB_RUN_NUMBER:-0} % 50 ))
          lat=$(node -e 'process.stdout.write((51.5574 + Number(process.argv[1]) * 0.0001).toFixed(4))' "$offset")
          echo "cold-key latitude for this run: $lat (offset $offset x 0.0001 deg from 51.5574)"
          endpoint="${TARGET}/api/places/search?intent=nearby-food&lat=${lat}&lng=-0.236&placeId=fp-google-ChIJ99IK4v8QdkgRZNGsdKK0pb8&radiusM=2000"

          auth=()
          if [ -n "${BYPASS:-}" ]; then
            auth+=(-H "x-vercel-protection-bypass: ${BYPASS}" -H "x-vercel-set-bypass-cookie: true")
          fi

          echo "cold request: $endpoint"
          curl -sS "${auth[@]}" -L --max-redirs 5 -c /tmp/fc-cookies -b /tmp/fc-cookies \
            -D /tmp/food-miss.h -o /tmp/food-miss.json -w 'status %{http_code} in %{time_total}s\n' \
            --max-time 60 "$endpoint"

          # Long enough that the store write has certainly landed, short enough to stay inside the window.
          sleep 5

          echo "repeat request, same key -- must reach the function and read the store"
          curl -sS "${auth[@]}" -L --max-redirs 5 -c /tmp/fc-cookies -b /tmp/fc-cookies \
            -D /tmp/food-hit.h -o /tmp/food-hit.json -w 'status %{http_code} in %{time_total}s\n' \
            --max-time 60 "$endpoint"

          # A THIRD request, because `s-maxage` is addressed to the CDN and Vercel consumes it rather than
          # passing it on: the client-facing Cache-Control reads just `public`, so the header cannot show
          # whether we still send the directive. `x-vercel-cache: HIT` on this request can only happen if
          # the edge accepted an s-maxage that came from our hit response, which is the proof. Costs
          # nothing either way -- edge or store, never Overpass.
          echo "third request -- the edge should now be serving it"
          curl -sS "${auth[@]}" -L --max-redirs 5 -c /tmp/fc-cookies -b /tmp/fc-cookies \
            -D /tmp/food-edge.h -o /tmp/food-edge.json -w 'status %{http_code} in %{time_total}s\n' \
            --max-time 60 "$endpoint"

          echo "--- x-vercel-cache per request ---"
          for f in miss hit edge; do
            printf '%s: %s\n' "$f" "$(grep -i '^x-vercel-cache:' /tmp/food-$f.h | tail -1 | tr -d '\r' || echo '(none)')"
          done

          cd familypilot
          node scripts/verify-food-cache-headers.mjs \
            /tmp/food-miss.h /tmp/food-miss.json \
            /tmp/food-hit.h /tmp/food-hit.json \
            /tmp/food-edge.h /tmp/food-edge.json

      # Free: two or three GETs of the same files a browser loads, and no account anywhere in it.
      #
      # The Saved tab shows Back up / Restore only when the build inlined EXPO_PUBLIC_SUPABASE_URL and the
      # publishable key. Those are read at BUILD time, so the dashboard listing them is not evidence the
      # running build has them; the bundle the page references is. The owner's instruction for this check
      # was explicit: do not create or upload a family profile to perform it. Reading the bundle needs
      # neither a sign-in nor a profile, and the same bytes answer the adversarial question too: nothing
      # that must stay server-side (sb_secret_, service_role, a Google API key) may be in them.
      - name: Verify the deployed client bundle is configured for Saved backup and ships no secret
        if: ${{ inputs.verify_client_config }}
        env:
          TARGET: ${{ steps.target.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # The one Supabase project every environment points at (docs/PROJECT_STATUS.md).
          EXPECT_REF: uuolfuebwimrsjfgffsm
        run: |
          set -euo pipefail
          auth=()
          if [ -n "${BYPASS:-}" ]; then
            auth+=(-H "x-vercel-protection-bypass: ${BYPASS}" -H "x-vercel-set-bypass-cookie: true")
          fi
          mkdir -p /tmp/client
          code=$(curl -sS "${auth[@]}" -L --max-redirs 5 -c /tmp/cc-cookies -b /tmp/cc-cookies \
            -o /tmp/client/index.html -w '%{http_code}' --max-time 45 "$TARGET/")
          echo "GET $TARGET/ -> $code"
          [ "$code" = "200" ] || { echo "::error::the page itself returned $code"; exit 1; }

          # Every exported bundle the page references, fetched by the same path a browser would use.
          # The verifier fails if any referenced bundle is missing here, so a partial fetch cannot pass.
          bundles=()
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            name=$(basename "$src")
            case "$src" in
              http*) full="$src" ;;
              /*) full="$TARGET$src" ;;
              *) full="$TARGET/$src" ;;
            esac
            bcode=$(curl -sS "${auth[@]}" -L --max-redirs 5 -c /tmp/cc-cookies -b /tmp/cc-cookies \
              -o "/tmp/client/$name" -w '%{http_code}' --max-time 90 "$full")
            echo "GET $full -> $bcode ($(wc -c < "/tmp/client/$name") bytes)"
            [ "$bcode" = "200" ] || { echo "::error::bundle $name returned $bcode"; exit 1; }
            bundles+=("/tmp/client/$name")
          done < <(grep -o '<script[^>]*src="[^"]*/_expo/static/js/web/[^"]*\.js"' /tmp/client/index.html \
                   | sed -E 's/.*src="([^"]*)".*/\1/' | sort -u)

          cd familypilot
          node scripts/verify-client-config.mjs /tmp/client/index.html "${bundles[@]}" --expect-ref="$EXPECT_REF"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-canary-evidence
          path: |
            docs/canary/live-report.json
            docs/canary/routes-report.json
          if-no-files-found: warn
