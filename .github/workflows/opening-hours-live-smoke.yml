name: Opening hours live smoke test

# Proves that a real Google Places response, mapped by THIS branch, actually yields the structured
# schedule the evaluator needs. The unit tests pin the mapper against Google's published schema;
# this pins the published schema against what Google really sends.
#
# It calls the pull request's own Vercel Preview build rather than production, so the code under
# test is the code in the diff. The preview URL is discovered from GitHub's Deployments API using
# the built-in token, so no Vercel credential is needed here.
#
# The Google API key stays server-side on Vercel throughout — this workflow never sees it, and the
# response it prints carries no secret (photo fields are paths to our own proxy).
#
# COST: one billable Place Details request per run, and only when the pull request touches
# `server/places/lib/google-places.js`. That is the cheapest possible way to answer "does Google
# still send what this mapper expects", and it is deliberately not the expensive discovery SKU.
#
# It does require the Preview environment to permit that one call. Google Places is off by default
# outside production (see server/places/lib/places-budget.js), so the Vercel Preview environment
# needs a narrow allowance — details only, no discovery, no photos, and a low daily cap. The exact
# variables are listed in docs/GOOGLE_PLACES_COST_CONTROL.md, and the step below names them in its
# error message if they are missing, rather than failing with an unexplained 503.

on:
  pull_request:
    paths:
      - 'server/places/lib/google-places.js'
      - '.github/workflows/opening-hours-live-smoke.yml'
  workflow_dispatch:
    inputs:
      place_id:
        description: FamilyPilot place id to probe
        required: false
        default: fp-google-ChIJzZtNX7UcdkgRzycysU2TrhM

permissions:
  contents: read
  deployments: read
  statuses: read

env:
  # Whitechapel Gallery: a real production row with published hours, and shut on Mondays — so a
  # correct mapping yields six periods rather than a uniform seven.
  PLACE_ID: ${{ inputs.place_id || 'fp-google-ChIJzZtNX7UcdkgRzycysU2TrhM' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the Vercel preview of this commit
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "looking for a preview deployment of $SHA"
          url=""
          for attempt in $(seq 1 40); do
            # Vercel registers a GitHub Deployment per commit; its status carries the preview URL.
            ids=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&per_page=20" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const rows = JSON.parse(s||"[]");
                  process.stdout.write(Array.isArray(rows)?rows.map(r=>r.id).join(" "):"");
                })')
            for id in $ids; do
              found=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=20" \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                    const rows = JSON.parse(s||"[]");
                    const ok = (Array.isArray(rows)?rows:[]).find(
                      (r) => r.state === "success" && (r.environment_url || "").includes("vercel.app"),
                    );
                    process.stdout.write(ok ? ok.environment_url : "");
                  })')
              if [ -n "$found" ]; then url="$found"; break; fi
            done
            if [ -n "$url" ]; then break; fi
            echo "  attempt $attempt: no successful preview yet, waiting"
            sleep 15
          done

          if [ -z "$url" ]; then
            echo "::error::no successful Vercel preview deployment found for $SHA"
            exit 1
          fi
          echo "preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Free: reports the preview's cost-control posture without making a billable request. Printed
      # before the probe so a failure below can be read against what was actually switched on.
      - name: Report the preview's Places cost posture
        env:
          PREVIEW: ${{ steps.preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -uo pipefail
          auth=()
          if [ -n "${BYPASS:-}" ]; then
            auth+=(-H "x-vercel-protection-bypass: ${BYPASS}" -H "x-vercel-set-bypass-cookie: true")
          fi
          curl -sS "${auth[@]}" -L --max-redirs 5 -c /tmp/vercel-cookies -b /tmp/vercel-cookies \
            --max-time 60 "${PREVIEW}/api/places/status" -o /tmp/status.json || true
          node -e '
            const fs = require("fs");
            let body = null;
            try { body = JSON.parse(fs.readFileSync("/tmp/status.json", "utf8")); } catch {}
            if (!body) { console.log("status endpoint unreadable; continuing to the probe"); process.exit(0); }
            console.log(JSON.stringify(body.placesBudget ?? { note: "no placesBudget in response" }, null, 2));
          '

      - name: Probe one real venue through the preview build
        env:
          PREVIEW: ${{ steps.preview.outputs.url }}
          # Vercel protects preview deployments by default, so an unauthenticated request is
          # bounced to SSO. Generated in the Vercel project under Deployment Protection →
          # Protection Bypass for Automation. Actions masks it in logs; it is only ever sent as a
          # request header to the project's own preview host.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          endpoint="${PREVIEW}/api/places/detail?id=${PLACE_ID}"
          echo "GET ${endpoint}"

          auth=()
          if [ -n "${BYPASS:-}" ]; then
            auth+=(-H "x-vercel-protection-bypass: ${BYPASS}" -H "x-vercel-set-bypass-cookie: true")
            echo "using the automation bypass secret"
          else
            echo "no bypass secret configured"
          fi

          # The bypass cookie is handed over by a redirect, so the hop has to be followed and the
          # cookie kept — stopping at the 307 would look identical to being refused.
          code=$(curl -sS "${auth[@]}" \
            -L --max-redirs 5 -c /tmp/vercel-cookies -b /tmp/vercel-cookies \
            -D /tmp/headers -o /tmp/detail.json \
            -w '%{http_code}' --max-time 90 "$endpoint")
          echo "status: $code  (after $(grep -ci '^location:' /tmp/headers || echo 0) redirect(s))"

          if [ "$code" != "200" ]; then
            # Where it was sent tells us whether this is authentication or something else. The
            # query is stripped because an SSO redirect carries a token in it.
            echo "redirect targets:"
            grep -i '^location:' /tmp/headers | sed 's/?.*//' || echo "  (none)"
          fi

          # A 503 from a working build is the cost gate, not an outage, and it names itself in the
          # body. Distinguishing the two here is what stops this check being read as "Google broke".
          if [ "$code" = "503" ] || [ "$code" = "429" ]; then
            if grep -q 'PLACES_DISABLED\|PLACES_BUDGET_EXCEEDED' /tmp/detail.json 2>/dev/null; then
              echo "gate response:"; head -c 400 /tmp/detail.json
              echo "::error::The preview build refused the request on cost grounds, not because the mapper is wrong. Google Places is off outside production by design. To let this check make its one Place Details call, set these in the Vercel project's PREVIEW environment: GOOGLE_PLACES_ENABLED=true, GOOGLE_PLACES_DISCOVERY_ENABLED=false, GOOGLE_PLACES_PHOTOS_ENABLED=false, GOOGLE_PLACES_MAX_CALLS_PER_DAY=25. See docs/GOOGLE_PLACES_COST_CONTROL.md."
              exit 1
            fi
          fi

          case "$code" in
            200) ;;
            301|302|303|307|308|401|403)
              if [ -z "${BYPASS:-}" ]; then
                echo "::error::The preview is behind Vercel Deployment Protection and no VERCEL_AUTOMATION_BYPASS_SECRET repository secret is set, so this check cannot reach the build under test. Create the secret in the Vercel project (Settings → Deployment Protection → Protection Bypass for Automation) and add it to this repository's Actions secrets. Production is public, but it runs main's mapper rather than this branch's, so it cannot stand in."
              else
                echo "::error::the bypass secret was sent and redirects were followed, but the preview still returned $code. If the redirect targets above point at Vercel SSO, the secret is stale or belongs to another project; otherwise the endpoint itself is redirecting."
              fi
              exit 1
              ;;
            *)
              echo "::error::detail endpoint returned $code"
              head -c 400 /tmp/detail.json || true
              exit 1
              ;;
          esac

          node scripts/assert-live-opening-hours.mjs /tmp/detail.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-hours-live-evidence
          path: /tmp/opening-hours-evidence.json
          if-no-files-found: warn
